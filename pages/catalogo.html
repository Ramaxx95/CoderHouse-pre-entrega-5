        <link rel="stylesheet" href="../styles/styles.css">
        <link rel="shortcut icon" href="../imgs/gibson.png" type="image/x-icon">

    <body>
        <header>
            <nav class="indice">
                <a href="../index.html">
                    <img src="../imgs/logo.png" alt="Logo de la tienda" class="imagen-logo">
                </a>
                <ul>
                    <li><a href="./catalogo.html" class="item-indice">Catálogo</a></li>
                    <li><a href="./accesorios.html" class="item-indice">Accesorios</a></li>

                    <li><a href="./faq.html" class="item-indice">FAQs</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <h1>Catálogo</h1>
            <p>Heche un vistazo a nuestra variedad de instrumentos.</p>
            <section>
                <h2>Guitarras Eléctricas</h2>
                <div class="contenedor-productos">
                    <article class="producto producto-1">
                        <h3>Gibson</h3>
                        <figure>
                            <img src="../imgs/gibson.png" alt="Foto de Gibson Les Paul." class="imagen-producto">
                            <figcaption>Tenemos modelos como la mítica Les Paul o la legendaria SG.</figcaption>
                        </figure>
                    </article>
                    <article class="producto producto-2">
                        <h3>Fender</h3>
                        <figure>
                            <img src="../imgs/fender.png" alt="Foto de Fender Stratocaster." class="imagen-producto">
                            <figcaption>Para los rockeros todo tipo de Stratocasters y Telecasters.</figcaption>
                        </figure>
                    </article>
                </div>
            </section>
            <section>
                <h2>Guitarras Criollas</h2>
                <div class="contenedor-productos">
                    <article class="producto">
                        <h3>Clásica</h3>
                        <figure>
                            <img src="../imgs/criolla.png" alt="Foto de Guitarra Clásica." class="imagen-producto">
                            <figcaption>Tambien poseemos guitarras con cuerdas de nylon.</figcaption>
                        </figure>
                    </article>
                </div>
            </section>
